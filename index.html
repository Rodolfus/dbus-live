<style>

  :root {

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12191a; --panel: #1b2527; --fg: #e6eeec; --muted: #9bacA8; --line: #2d3a3c;
    --accent: #3cc5b0; --ok: #4cc27f; --bad: #ef7a63; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #12191a; --panel: #1b2527; --fg: #e6eeec; --muted: #9bacA8; --line: #2d3a3c;
    --accent: #3cc5b0; --ok: #4cc27f; --bad: #ef7a63; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); display: grid; grid-template-columns: 300px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .01em; }
  #estado { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  #estado i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  #estado.ok i { background: var(--ok); } #estado.error i { background: var(--bad); }
  #estado.error { color: var(--bad); }
  .acciones { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); } button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #lineas { overflow-y: auto; padding: 6px 8px 14px; flex: 1; min-height: 0; }
  .linea { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 5px 8px; }
  .linea:hover { background: var(--bg); }
  .linea .chip { min-width: 40px; text-align: center; font-weight: 700; font-size: 12.5px; color: #fff; border-radius: 5px; padding: 2px 5px; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
  .linea .nom { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linea .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .linea.off { opacity: .38; }
  #map { height: 100%; min-width: 0; }
  .bus { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #fff; color: #fff; font: 700 11.5px/25px var(--font); text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,.5); text-shadow: 0 1px 1px rgba(0,0,0,.4); }
  .leaflet-container { font-family: var(--font); }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: 210px 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>

      if (c2 === 1 && t2 === 2) e.id = texto(buf, r2);
      if (c2 !== 4 || t2 !== 2) return;                   // vehicle
      campos(buf, r2[0], r2[1], (c3, t3, r3) => {
        if (t3 !== 2) return;
        if (c3 === 1) campos(buf, r3[0], r3[1], (c4, t4, r4) => { if (c4 === 5 && t4 === 2) e.ruta = texto(buf, r4); });   // trip.route_id
        if (c3 === 2) campos(buf, r3[0], r3[1], (c4, t4, r4) => {                                                            // position
          if (t4 !== 5) return;
          if (c4 === 1) e.lat = dv.getFloat32(r4, true);
          if (c4 === 2) e.lon = dv.getFloat32(r4, true);
        });
        if (c3 === 8) campos(buf, r3[0], r3[1], (c4, t4, r4) => { if (c4 === 1 && t4 === 2) e.id = texto(buf, r4); });       // vehicle.id
      });
    });
    if (e.lat !== null && e.lon !== null) salida.push(e);
  });
  return salida;
}
// ==FIN DECODER==

// ====== MAPA ======
window.addEventListener('error', ev => { const s = document.querySelector('#estado span'); if (s) { s.textContent = 'Error en la página: ' + ev.message; document.getElementById('estado').className = 'error'; } });
if (typeof L === 'undefined') throw new Error('No se ha podido cargar Leaflet (la librería del mapa). Comprueba la conexión.');
const map = L.map('map', { zoomControl: true }).setView([43.3183, -1.9812], 13);
// Mapa de fondo sin clave (Esri). Alternativas con cuenta gratuita: MapTiler o Stadia Maps.
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Mapa © Esri, HERE, Garmin, OpenStreetMap · Datos: Dbus / Open Data Euskadi'
}).addTo(map);

const porRuta = {};      // id de línea -> { capa, color, n, visible, buses }
const capaBuses = L.layerGroup().addTo(map);
DATA.routes.forEach(r => {
  const capa = L.layerGroup(r.s.map(p => L.polyline(p, { color: r.c, weight: 4, opacity: .8 })));
  capa.addTo(map);
  porRuta[r.id] = { r, capa, visible: true, buses: 0 };
});

// Paradas: solo se dibujan con zoom cercano para no saturar el mapa
const capaParadas = L.layerGroup();
DATA.stops.forEach(([nombre, lat, lon]) =>
  L.circleMarker([lat, lon], { radius: 4, weight: 1.5, color: '#444', fillColor: '#fff', fillOpacity: 1 })
    .bindTooltip(nombre).addTo(capaParadas));
function paradas() { map.getZoom() >= 15 ? capaParadas.addTo(map) : map.removeLayer(capaParadas); }
map.on('zoomend', paradas); paradas();

// ====== PANEL DE LÍNEAS ======
const cont = document.getElementById('lineas');
DATA.routes.forEach(r => {
  const b = document.createElement('button');
  b.className = 'linea'; b.type = 'button';
  b.innerHTML = '<span class="chip" style="background:' + r.c + '">' + r.n + '</span><span class="nom"></span><span class="n"></span>';
  b.querySelector('.nom').textContent = r.name;
  b.onclick = () => ponerLinea(r.id, !porRuta[r.id].visible);
  porRuta[r.id].btn = b; cont.appendChild(b);
});
function ponerLinea(id, v) {
  const o = porRuta[id]; o.visible = v;
  v ? o.capa.addTo(map) : map.removeLayer(o.capa);
  o.btn.classList.toggle('off', !v);
  dibujarBuses();
}
document.getElementById('todas').onclick = () => Object.keys(porRuta).forEach(id => ponerLinea(id, true));
document.getElementById('ninguna').onclick = () => Object.keys(porRuta).forEach(id => ponerLinea(id, false));

// ====== AUTOBUSES EN TIEMPO REAL ======
const marcadores = new Map();   // id de vehículo -> marcador
let ultimos = [];
function dibujarBuses() {
  const vistos = new Set();
  Object.values(porRuta).forEach(o => o.buses = 0);
  ultimos.forEach(b => {
    const o = porRuta[b.ruta];
    if (o) o.buses++;
    if (o && !o.visible) return;
    const color = o ? o.r.c : '#666', n = o ? o.r.n : '?';
    vistos.add(b.id);
    let m = marcadores.get(b.id);
    if (!m) {
      m = L.marker([b.lat, b.lon], { icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15], html: '<div class="bus"></div>' }) });
      m.addTo(capaBuses); marcadores.set(b.id, m);
    } else m.setLatLng([b.lat, b.lon]);
    const el = m.getElement().firstChild; el.style.background = color; el.textContent = n;
    m.bindTooltip('Línea ' + n + ' · autobús ' + b.id);
  });
  marcadores.forEach((m, id) => { if (!vistos.has(id)) { capaBuses.removeLayer(m); marcadores.delete(id); } });
  Object.values(porRuta).forEach(o => o.btn.querySelector('.n').textContent = o.buses || '');
}

const estado = document.getElementById('estado');
function mostrar(clase, txt) { estado.className = clase; estado.querySelector('span').textContent = txt; }

async function pedirFeed() { return fetch(FEED_URL, { cache: 'no-store' }); }
async function actualizar() {
  let r;
  try { r = await pedirFeed(); }
  catch (err) { mostrar('error', 'No se pueden cargar los autobuses ahora mismo. Se reintentará solo.'); return; }
  try {
    if (!r.ok) throw new Error('El servidor respondió ' + r.status);
    ultimos = decodificarFeed(new Uint8Array(await r.arrayBuffer()));
    dibujarBuses();
    mostrar('ok', ultimos.length + ' autobuses · ' + new Date().toLocaleTimeString('es-ES'));
  } catch (err) { mostrar('error', 'Error: ' + err.message); }
}
actualizar(); setInterval(actualizar, CADA_SEGUNDOS * 1000);
</script>
